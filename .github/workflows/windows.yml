name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build and test without audio hardware
        run: .\test.ps1
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match VERSION.' }
      - name: Prepare standalone executable
        run: .\package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MicCast-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MicCast-windows-x64
          path: artifacts
      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = (Get-Content artifacts\SHA256SUMS.txt -Raw).Split(' ')[0].Trim()
          $actual = (Get-FileHash artifacts\MicCast.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Artifact checksum mismatch.' }
          gh release create $env:GITHUB_REF_NAME artifacts/MicCast.exe artifacts/SHA256SUMS.txt artifacts/QUICKSTART.md artifacts/LICENSE.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "MicCast v$version" --notes-file "docs/releases/v$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
